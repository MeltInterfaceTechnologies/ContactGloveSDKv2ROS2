name: Mock server tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  timestamp-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install python-osc==1.10.2
      - run: python -m unittest discover -s scripts/mock_server -p 'test_*.py' -v
